name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  social:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Verify bootstrap files
        run: |
          test -f README.md
          test -f LICENSE
          test -f providers/registry.json
          test -f scripts/check-providers.mjs
          test -f scripts/check-templates.mjs
          test -f contracts/social-export.v0.json
          test -f templates/announcement.json
          test -f templates/lineup.json
          test -f templates/score.json
          test -f templates/result.json
          test -f templates/clip.json
      - name: Provider and template checks
        run: npm run check
      - name: Tests
        run: npm test
